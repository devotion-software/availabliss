<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Availabliss · My time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root,.av{--accent:#5546FF;--accent-ink:#3B2FD0;--accent-soft:rgba(85,70,255,.14);--orb1:#FFB894;--orb2:#9DA6FF;--orb3:#8EE3CC;--bg:#ECEEF7;--ink:#1A1B3A;--muted:#4D5072;--neutral-ink:#3A3D5C;--surface:rgba(255,255,255,.62);--glass:rgba(255,255,255,.5);--glass-border:rgba(255,255,255,.8);--glass-hi:rgba(255,255,255,.9);--shadow:rgba(43,38,120,.38);--line:rgba(26,27,58,.07);--line-2:rgba(26,27,58,.14);--line-3:rgba(26,27,58,.28);--solid:#1A1B3A;--on-solid:#FFFFFF;--on-accent:#FFFFFF;--busy-bg:#FFFFFF;--busy-line:#B9BCD6;--ok:#0FA37F;--ok-bg:#D3F5EA;--ok-ink:#0D6B52;--warn:#FF8A5E;--warn-bg:#FFE0CF;--warn-ink:#8A3410;--t1:#FFD3BF;--t2:#D6DAFF;--t3:#C8F1E4;--t4:#F5D6EE;--t5:#FFE7A3;--orb-op:.85}
.av.dark{--accent-ink:#B4ACFF;--accent-soft:rgba(130,118,255,.24);--bg:#0C0D1D;--ink:#F1F2FA;--muted:#A6A9C8;--neutral-ink:#C9CBE3;--surface:rgba(255,255,255,.07);--glass:rgba(26,28,56,.5);--glass-border:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.1);--shadow:rgba(0,0,0,.6);--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);--line-3:rgba(255,255,255,.3);--solid:#F1F2FA;--on-solid:#0C0D1D;--busy-bg:rgba(255,255,255,.14);--busy-line:#4A4D70;--ok:#34D3A0;--ok-bg:rgba(52,211,160,.16);--ok-ink:#7EE8C6;--warn:#FF9A73;--warn-bg:rgba(255,138,94,.18);--warn-ink:#FFBCA2;--t1:#5C3B2E;--t2:#363B78;--t3:#1E5045;--t4:#58304F;--t5:#5A4A1E;--orb-op:.42}
.t-dawn{--accent:#5546FF;--accent-ink:#3B2FD0;--accent-soft:rgba(85,70,255,.14);--orb1:#FFB894;--orb2:#9DA6FF;--orb3:#8EE3CC}
.dark.t-dawn{--accent:#6A5CFF;--accent-ink:#B4ACFF;--accent-soft:rgba(130,118,255,.24)}
.t-lagoon{--accent:#0B7F8A;--accent-ink:#06646D;--accent-soft:rgba(11,127,138,.14);--orb1:#86E3E0;--orb2:#8EC5FF;--orb3:#B5EBA8}
.dark.t-lagoon{--accent-ink:#7FDDE4;--accent-soft:rgba(19,156,168,.26)}
.t-sunset{--accent:#C9401F;--accent-ink:#A8341A;--accent-soft:rgba(201,64,31,.13);--orb1:#FFA585;--orb2:#FF9CC0;--orb3:#FFD37E}
.dark.t-sunset{--accent-ink:#FFB199;--accent-soft:rgba(224,83,47,.26)}
.t-orchid{--accent:#9333C9;--accent-ink:#7A27AA;--accent-soft:rgba(147,51,201,.13);--orb1:#F4B0E0;--orb2:#C9A8FF;--orb3:#A9B8FF}
.dark.t-orchid{--accent:#A646DB;--accent-ink:#DDB0F7;--accent-soft:rgba(166,70,219,.26)}
.t-grove{--accent:#2D7A4A;--accent-ink:#22633B;--accent-soft:rgba(45,122,74,.14);--orb1:#C3E88F;--orb2:#8FD8B5;--orb3:#F3D78A}
.dark.t-grove{--accent-ink:#9FE0B6;--accent-soft:rgba(58,148,96,.26)}
.av{transition:background .3s ease,color .3s ease}
.av .orb{opacity:var(--orb-op) !important}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 40px -22px var(--shadow)}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.025em}
button{font:inherit;color:inherit;cursor:pointer}
.slot{transition:transform .12s ease,background .2s ease}
.slot:active{transform:scale(.96)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .3s cubic-bezier(.2,1.1,.4,1) both}
</style>
</helmet>
<div class="{{themeClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink)">
  <div class="orb" aria-hidden="true" style="width:320px;height:320px;left:-140px;top:-90px;background:var(--orb3)"></div>
  <div class="orb" aria-hidden="true" style="width:300px;height:300px;right:-150px;top:260px;background:var(--orb1)"></div>
  <div class="orb" aria-hidden="true" style="width:300px;height:300px;left:-80px;bottom:-60px;background:var(--orb2)"></div>

  <div style="position:relative;height:100%;box-sizing:border-box;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px">
    <header style="display:flex;align-items:center;gap:10px">
      <a href="Main.dc.html" class="glass" aria-label="Back to groups" style="width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="flex:1;display:flex;flex-direction:column">
        <h1 class="disp" style="margin:0;font-size:24px;font-weight:700;line-height:1.1">My time</h1>
        <span style="font-size:12px;color:var(--muted)">Tap to block time you're busy</span>
      </div>
      <a href="Calendars.dc.html" class="glass" aria-label="Connected calendars" style="width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>
      </a>
    </header>

    <div style="display:flex;align-items:center;gap:8px">
      <button class="glass" aria-label="Previous week" style="width:40px;height:40px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <span class="disp" style="flex:1;text-align:center;font-size:17px;font-weight:650">2 – 8 November</span>
      <button class="glass" aria-label="Next week" style="width:40px;height:40px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>

    <section class="glass" aria-label="Busy times this week" style="border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:6px">
      <div style="display:grid;grid-template-columns:50px repeat(3, minmax(0, 1fr));gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-align:center">
        <span></span><span>Morning</span><span>Afternoon</span><span>Evening</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display:grid;grid-template-columns:50px repeat(3, minmax(0, 1fr));gap:6px;align-items:center">
          <span style="display:flex;flex-direction:column;line-height:1.15">
            <span style="font-size:12px;font-weight:600">{{r.day}}</span>
            <span style="font-size:11px;color:var(--muted)">{{r.date}}</span>
          </span>
          <sc-for list="{{r.slots}}" as="s" hint-placeholder-count="3">
            <button class="slot" onClick="{{s.toggle}}" aria-pressed="{{s.blocked}}" aria-label="{{s.aria}}" style="height:46px;border-radius:12px;padding:0 6px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;{{s.style}}">
              <sc-if value="{{s.cal}}" hint-placeholder-val="{{false}}">
                <span style="width:6px;height:6px;border-radius:50%;flex:none;background:{{s.dot}}"></span>
              </sc-if>
              <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.label}}</span>
            </button>
          </sc-for>
        </div>
      </sc-for>
      <div style="display:flex;flex-wrap:wrap;gap:12px;padding-top:6px;font-size:11px;color:var(--muted)">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--accent) 0 2px,var(--accent-soft) 2px 5px)"></span>Blocked by you</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:12px;height:10px;border-radius:3px;background:var(--busy-bg);opacity:.5;border:1px solid var(--busy-line)"></span>From a calendar</span>
        <span>{{blockedCount}}</span>
      </div>
    </section>

    <div class="glass" style="border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:12px">
      <span style="width:34px;height:34px;flex:none;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
      </span>
      <div style="flex:1;display:flex;flex-direction:column">
        <span style="font-size:14px;font-weight:600">Choir</span>
        <span style="font-size:12px;color:var(--muted)">Every Tuesday · 19:00 – 21:30</span>
      </div>
      <span style="font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--line);color:var(--neutral-ink)">Private</span>
    </div>

    <div style="flex:1"></div>
    <button onClick="{{openSheet}}" style="height:54px;border:0;border-radius:18px;background:var(--solid);color:var(--on-solid);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Block a specific time
    </button>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;background:rgba(12,13,29,.28)">
      <div class="glass rise" role="dialog" aria-label="Block a time" style="position:absolute;left:8px;right:8px;bottom:8px;border-radius:32px;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--bg)">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <h2 class="disp" style="margin:0;font-size:22px;font-weight:700">Block a time</h2>
          <button onClick="{{closeSheet}}" aria-label="Close" style="width:40px;height:40px;border-radius:50%;border:0;background:var(--line);display:flex;align-items:center;justify-content:center;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
          <button style="min-height:60px;border-radius:16px;border:1px solid var(--glass-border);background:var(--surface);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:11px;font-weight:600;color:var(--muted)">Date</span>
            <span style="font-size:15px;font-weight:600">Sat 21 Nov</span>
          </button>
          <button style="min-height:60px;border-radius:16px;border:1px solid var(--glass-border);background:var(--surface);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:11px;font-weight:600;color:var(--muted)">Time</span>
            <span style="font-size:15px;font-weight:600">{{whenLabel}}</span>
          </button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{whens}}" as="w" hint-placeholder-count="4">
            <button onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="height:38px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;{{w.style}}">{{w.label}}</button>
          </sc-for>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:13px;font-weight:600;color:var(--muted)">Repeat</span>
          <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:6px;padding:4px;border-radius:14px;background:var(--line)">
            <sc-for list="{{repeats}}" as="rp" hint-placeholder-count="3">
              <button onClick="{{rp.pick}}" aria-pressed="{{rp.on}}" style="height:36px;border:0;border-radius:10px;font-size:13px;font-weight:600;{{rp.style}}">{{rp.label}}</button>
            </sc-for>
          </div>
        </div>
        <label for="note" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)">
          Note (only you see this)
          <input id="note" placeholder="e.g. Wedding" style="height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font:inherit;font-size:15px;font-weight:400;color:var(--ink);box-sizing:border-box">
        </label>
        <button onClick="{{closeSheet}}" style="height:52px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600">Block this time</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"theme":{"editor":"enum","options":["dawn","lagoon","sunset","orchid","grove"],"default":"dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { manual: { '1-2': true, '5-1': true }, sheet: false, when: 'day', repeat: 'never' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var days = [['Mon', '2'], ['Tue', '3'], ['Wed', '4'], ['Thu', '5'], ['Fri', '6'], ['Sat', '7'], ['Sun', '8']];
    var parts = ['morning', 'afternoon', 'evening'];
    // Busy blocks that come from connected calendars (read-only here).
    var cal = { '0-0': 'Work', '0-1': 'Work', '1-0': 'Work', '1-1': 'Work', '2-0': 'Work', '2-1': 'Work', '3-0': 'Work', '3-1': 'Work', '3-2': 'Dentist', '4-0': 'Work', '4-1': 'Work', '6-0': 'Parkrun' };
    var labels = { '1-2': 'Choir' };
    var count = 0;
    var rows = days.map(function (d, di) {
      return {
        day: d[0], date: d[1],
        slots: parts.map(function (p, pi) {
          var key = di + '-' + pi;
          var fromCal = cal[key];
          var blocked = !fromCal && !!s.manual[key];
          if (blocked) count++;
          var style;
          if (fromCal) style = 'background:var(--busy-bg);border:1px solid var(--busy-line);opacity:.5;color:var(--ink);cursor:default';
          else if (blocked) style = 'background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,transparent 6px 12px),var(--surface);border:1.5px solid var(--accent);color:var(--accent-ink)';
          else style = 'background:var(--surface);border:1px solid var(--glass-border);color:var(--muted)';
          return {
            cal: !!fromCal, blocked: blocked,
            dot: fromCal === 'Work' ? '#5B8DEF' : '#FF8A5E',
            label: fromCal || (blocked ? (labels[key] || 'Busy') : ''),
            aria: d[0] + ' ' + d[1] + ' ' + p + (fromCal ? ', busy from calendar: ' + fromCal : blocked ? ', blocked by you' : ', free'),
            toggle: function () {
              if (fromCal) return;
              var next = Object.assign({}, s.manual);
              next[key] = !blocked;
              self.setState({ manual: next });
            }
          };
        })
      };
    });
    var chip = function (on) { return on ? 'background:var(--solid);color:var(--on-solid);border:1px solid var(--solid)' : 'background:var(--surface);color:var(--ink);border:1px solid var(--glass-border)'; };
    var whenMap = { day: 'All day', morning: 'Morning', evening: 'Evening', custom: '14:00 – 18:00' };
    return {
      themeClass: 'av ' + (this.props.mode || 'light') + ' t-' + (this.props.theme || 'dawn'),
      rows: rows,
      blockedCount: count + ' blocked this week',
      sheet: s.sheet,
      openSheet: function () { self.setState({ sheet: true }); },
      closeSheet: function () { self.setState({ sheet: false }); },
      whenLabel: whenMap[s.when],
      whens: [['day', 'All day'], ['morning', 'Morning'], ['evening', 'Evening'], ['custom', 'Custom']].map(function (w) {
        return { label: w[1], on: s.when === w[0], style: chip(s.when === w[0]), pick: function () { self.setState({ when: w[0] }); } };
      }),
      repeats: [['never', 'Once'], ['weekly', 'Weekly'], ['fortnightly', 'Fortnightly']].map(function (r) {
        var on = s.repeat === r[0];
        return { label: r[1], on: on, style: on ? 'background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px var(--shadow)' : 'background:transparent;color:var(--muted)', pick: function () { self.setState({ repeat: r[0] }); } };
      })
    };
  }
}
</script>
</body>
</html>
