<!doctype html>
<html lang="en" data-mode="system" data-theme="dawn" data-scheme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="Availabliss finds the time that works for everyone." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap"
		/>
		<!-- Resolve "system" to a concrete scheme before first paint, and track OS changes. -->
		<script>
			(function () {
				var root = document.documentElement;
				var media = window.matchMedia('(prefers-color-scheme: dark)');
				function apply() {
					var mode = root.getAttribute('data-mode');
					root.setAttribute('data-scheme', mode === 'dark' || (mode === 'system' && media.matches) ? 'dark' : 'light');
				}
				apply();
				media.addEventListener('change', apply);
				new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-mode'] });
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
