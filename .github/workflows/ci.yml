name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; the Docker job's layer cache uses the Actions cache service.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which platforms a change touches so a web-only change doesn't wait on Xcode.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'

  web:
    name: Web · type-check, unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Unit tests
        run: bun test src --coverage
        env:
          # Some tested modules import the DB pool; it connects lazily, so nothing is reached.
          DATABASE_URL: mysql://test:test@127.0.0.1:3306/test

  smoke:
    name: Web · end-to-end smoke test (production build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: availabliss
          MARIADB_USER: availabliss
          MARIADB_PASSWORD: availablisspass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: mysql://availabliss:availablisspass@127.0.0.1:3306/availabliss
      REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      ORIGIN: http://localhost:3000
      PORT: 3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      BASE_URL: http://localhost:3000
      MAILPIT_URL: http://localhost:8025
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The only web build in CI (the Docker job builds its own inside the image).
      - name: Build
        run: bun run build
      - name: Migrate
        run: node scripts/migrate.js
      - name: DB integration tests
        run: bun run test:integration
      - name: Start server
        env:
          # Production mode, so rate limits are on as they are when deployed.
          NODE_ENV: production
        run: |
          node build > server.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:3000/api/v1/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Redis integration tests
        run: bun test src/lib/server/redis
      - name: Smoke test
        run: bun scripts/smoke.ts
      - name: Server log
        if: failure()
        run: cat server.log

  docker:
    name: Web · Docker image
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: availabliss-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android · unit tests, debug build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The default ('tools platform-tools') fails: current cmdline-tools no longer ship 'tools'.
          packages: platform-tools platforms;android-37.0
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests

  ios:
    name: iOS · simulator build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - uses: actions/cache@v6
        with:
          path: ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: >-
          xcodebuild -project ios/Availabliss.xcodeproj -scheme Availabliss
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build
          -clonedSourcePackagesDirPath ios/build/SourcePackages
          CODE_SIGNING_ALLOWED=NO build
