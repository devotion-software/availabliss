<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Availabliss · Groups (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;background:#0C0D1D">
  <dc-import name="Main" mode="dark" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dawn","lagoon","sunset","orchid","grove"],"default":"dawn"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme || 'dawn' };
  }
}
</script>
</body>
</html>
