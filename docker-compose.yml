# Local development services. The app itself runs with `make dev`.
services:
  mariadb:
    image: mariadb:11.4
    container_name: availabliss-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${DB_NAME:-availabliss}
      MARIADB_USER: ${DB_USER:-availabliss}
      MARIADB_PASSWORD: ${DB_PASSWORD:-availablisspass}
    ports:
      - '${DB_PORT:-3312}:3306'
    volumes:
      - availabliss-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches all outgoing dev email — view it at http://localhost:8027
  mailpit:
    image: axllent/mailpit:latest
    container_name: availabliss-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1027}:1025'
      - '${MAILPIT_UI_PORT:-8027}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  availabliss-db-data:
