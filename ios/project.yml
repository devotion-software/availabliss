name: Availabliss
options:
  bundleIdPrefix: dev.joeherbert
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  # In-app purchases for Pro (see docs/BILLING.md). The paywall is our own; RevenueCatUI isn't used.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.100.0
  # Crash and error reporting, traces and session replay (App/CrashReporting.swift).
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.35.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # Shared by the app and its widget extension (an extension's versions must match the app's).
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Availabliss:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets:
        - AvailablissTests
        - AvailablissUITests
    sources:
      - path: Availabliss
        excludes:
          - "**/README.md"
      # The widget snapshot, also compiled into AvailablissWidgets.
      - path: Shared
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Sentry
        product: Sentry
      - target: AvailablissWidgets
      - target: AvailablissShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Availabliss
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSOCIATED_DOMAIN_MODE: ""
      configs:
        # Debug builds fetch the apple-app-site-association file straight from the server instead of
        # Apple's CDN (which can lag a day). Needs Settings → Developer → Associated Domains
        # Development turned on on the device. Release builds keep the normal CDN lookup.
        Debug:
          ASSOCIATED_DOMAIN_MODE: "?mode=developer"
    postBuildScripts:
      # Uploads the app's dSYMs to Sentry so crash reports show file names and lines. Release builds
      # only (archives), and only with SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT set in
      # Config/Secrets.xcconfig and sentry-cli installed (brew install getsentry/tools/sentry-cli).
      - name: Upload dSYMs to Sentry
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
        script: |
          if [ "$CONFIGURATION" != "Release" ] || [ -z "$SENTRY_AUTH_TOKEN" ]; then exit 0; fi
          SENTRY_CLI="$(command -v sentry-cli || echo /opt/homebrew/bin/sentry-cli)"
          if [ ! -x "$SENTRY_CLI" ]; then
            echo "warning: sentry-cli isn't installed, so dSYMs weren't uploaded to Sentry"
            exit 0
          fi
          "$SENTRY_CLI" debug-files upload "$DWARF_DSYM_FOLDER_PATH/$DWARF_DSYM_FILE_NAME" \
            || echo "warning: uploading dSYMs to Sentry failed"
    entitlements:
      path: Availabliss/Resources/Availabliss.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - webcredentials:$(ASSOCIATED_DOMAIN_HOST)$(ASSOCIATED_DOMAIN_MODE)
          - applinks:$(ASSOCIATED_DOMAIN_HOST)$(ASSOCIATED_DOMAIN_MODE)
        aps-environment: $(APS_ENVIRONMENT)
        # Shares the widget snapshot with AvailablissWidgets.
        com.apple.security.application-groups:
          - group.dev.joeherbert.availabliss
    info:
      path: Availabliss/Resources/Info.plist
      properties:
        CFBundleDisplayName: Availabliss
        # Lets debug builds reach the local dev server over http (localhost / *.local only).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # App configuration read by AppConfig.swift
        AVAPIBaseURL: $(API_BASE_URL)
        AVAssociatedDomainHost: $(ASSOCIATED_DOMAIN_HOST)
        AVGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        AVGoogleRedirectScheme: $(GOOGLE_REVERSED_CLIENT_ID)
        AVSentryDSN: $(SENTRY_DSN)
        CFBundleURLTypes:
          - CFBundleURLName: dev.joeherbert.availabliss
            CFBundleURLSchemes:
              - availabliss
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - dev.joeherbert.availabliss.calendar-refresh
        NSCalendarsFullAccessUsageDescription: Availabliss reads when you're busy (never what you're doing) so your groups can find times that work. Only start and end times leave your phone.
        NSCalendarsWriteOnlyAccessUsageDescription: Availabliss adds confirmed plans to your calendar.
        NSCalendarsUsageDescription: Availabliss reads when you're busy so your groups can find times that work.
        NSFaceIDUsageDescription: Use Face ID to sign in with your passkey.
        NSLocationWhenInUseUsageDescription: Availabliss uses your location only when you choose to send where you are to a group chat. It isn't tracked or shared otherwise.
        # Opens shared places in the Google Maps app when it's installed.
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # Google Fonts variable TTFs; AppFont picks the family and sets the weight axis.
        UIAppFonts:
          - BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf
          - InstrumentSans-VariableFont_wdth,wght.ttf
          - InstrumentSans-Italic-VariableFont_wdth,wght.ttf

  # Home-screen widgets: Next plan and Waiting for you. They draw from the snapshot the app writes
  # to the App Group (Shared/WidgetSnapshot.swift) and never call the API themselves.
  AvailablissWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AvailablissWidgets
      - path: Shared
    settings:
      base:
        # The app's bundle id (from Config/*.xcconfig) plus .widgets, as an embedded extension needs.
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widgets
        PRODUCT_NAME: AvailablissWidgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: AvailablissWidgets/AvailablissWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.joeherbert.availabliss
    info:
      path: AvailablissWidgets/Info.plist
      properties:
        CFBundleDisplayName: Availabliss
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit tests for the app's logic, hosted by the app (`make ios-test`). Swift Testing.
  AvailablissShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AvailablissShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).share
        PRODUCT_NAME: AvailablissShare
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: AvailablissShare/AvailablissShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.joeherbert.availabliss
    info:
      path: AvailablissShare/Info.plist
      properties:
        CFBundleDisplayName: Availabliss
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AVAPIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A predicate rather than the dictionary keys: Apple Wallet shares a pass as com.apple.pkpass
            # data (not a file), which the keys don't cover, and nor do videos. Up to 10 items.
            NSExtensionActivationRule: "SUBQUERY (extensionItems, $extensionItem, $extensionItem.attachments.@count <= 10 AND SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.image\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.movie\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.file-url\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"com.apple.pkpass\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"com.apple.pkpasses\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.url\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.plain-text\" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.data\").@count >= 1).@count >= 1"

  AvailablissTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AvailablissTests
    dependencies:
      - target: Availabliss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joeherbert.availabliss.tests
        GENERATE_INFOPLIST_FILE: YES

  # End-to-end UI tour against a running dev server (see AvailablissUITests/README.md).
  AvailablissUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AvailablissUITests
        excludes:
          - "**/README.md"
    dependencies:
      - target: Availabliss
    info:
      path: AvailablissUITests/Info.plist
      properties:
        # The test reads sign-in codes from Mailpit on localhost over http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joeherbert.availabliss.uitests
